# Canonical Keycloak bearer-validation contract for protected Middleware routes.
# This file contains no client secret. Runtime activation remains controlled by
# the repository's exact route reconcilers and protected deployment process.
_format_version: "3.0"

plugins:
  - name: openid-connect
    enabled: true
    config:
      issuer: https://auth.codestra.co/realms/codestra/.well-known/openid-configuration
      auth_methods:
        - bearer
      audience:
        - middleware-api
      consumer_claim:
        - azp
      cache_tokens_salt: "{vault://env/kong-oidc-cache-tokens-salt}"
      audience_required:
        - middleware-api
      issuers_allowed:
        - https://auth.codestra.co/realms/codestra
      bearer_token_param_type:
        - header
      verify_signature: true
      verify_claims: true
      ssl_verify: true
      consumer_by:
        - username
      consumer_optional: false
      cache_ttl: 300
      cache_ttl_max: 300
      rediscovery_lifetime: 30
      leeway: 0
