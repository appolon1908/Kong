      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 120
      policy: redis
      fault_tolerant: false
      hide_client_headers: false
      redis:
        host: codestra-redis
        port: 6379
        database: 0
        timeout: 2000
        password: '{vault://env/kong-rate-limit-redis-password}'
  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes
