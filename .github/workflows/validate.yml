name: Validate Kong source authority

on:
  pull_request:
    branches: [main, staging, production, integration/middleware-8095-20260919, mission/kong-v3-certification-gates-20260920]
  push:
    branches: [main, staging, production, integration/middleware-8095-20260919, mission/kong-v3-certification-gates-20260920]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source-head:
    name: source-head
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify workstation validation toolchain
        run: |
          set -Eeuo pipefail
          command -v shellcheck
          command -v lua
          command -v luac
          python3 -m pip install --disable-pip-version-check pytest PyYAML -r tools/gateway-test-requirements.txt
      - name: Validate structured source and calling policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          for path in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml')):
              yaml.safe_load(path.read_text())
          PY
          python3 -m compileall -q deploy operations scripts tests tools
          python3 scripts/validate_community_n8n_egress.py
          python3 scripts/validate_kong_calling_policy.py
          python3 scripts/validate_kong_calling_policy.py --self-test
          python3 scripts/validate_kong_production_inventory.py
          python3 scripts/validate_middleware_edge_contract.py
          python3 scripts/validate_kong_foundation.py --v3-phase auto | tee /tmp/kong-v3-foundation.txt
          python3 scripts/validate_release_supply_chain.py
          python3 tools/release_contract.py --assert-repository "${GITHUB_REPOSITORY}" --assert-owner "${GITHUB_REPOSITORY_OWNER}"
          luac -p deploy/kong/scope-policy.lua
          luac -p deploy/kong/calling-policy.lua
          luac -p deploy/kong/correlation-required.lua
          luac -p deploy/kong/moneybee-identity-policy.lua
      - name: Validate shell policies
        run: |
          find operations deploy scripts tools -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          find operations deploy scripts tools -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -x
      - name: Run Kong authority tests
        run: |
          pytest -q \
            tests/test_kong_canonical_route_contract.py \
            tests/test_kong_route_authority_hardening.py \
            tests/test_kong_n8n_control_plane.py \
            tests/test_kong_n8n_editor_route.py \
            tests/test_oidc_auth.py \
            tests/test_kong_database_operations.py \
            tests/test_kong_change_authority.py \
            tests/test_release_governance.py \
            tests/test_kong_observability.py \
            tests/test_kong_calling_policy.py \
            tests/test_kong_foundation.py \
            tests/test_kong_production_inventory.py \
            tests/test_kong_identity_security.py \
            tests/test_kong_middleware_contract_v2.py
          pytest -q tests/test_runtime_integration_preflight.py tests/test_kong_read_only_capture.py tests/test_gateway_release_boundaries.py tests/test_kong_runtime_certification.py tests/test_release_candidate_promotion.py tests/test_kong_admin_channel.py tests/test_kong_standby_apply.py tests/test_kong_standby_rollback.py tests/test_gateway_integrations.py tests/test_gateway_plugins.py tests/test_gateway_foundation_authority.py
          pytest -q tests/test_community_n8n_egress.py
          if grep -q '^V3_PHASE=INTEGRATED$' /tmp/kong-v3-foundation.txt; then
            python3 tools/generate_migration_manifests.py --check
            python3 tools/verify_migration_manifest.py
            echo "FINAL_MANIFEST_REGEN=PASS"
          else
            echo "867904618fcdf98ef603e27a5ff9fa8dda0ee1b78c9a030b317ea1391dfafb4a  MIGRATION_MANIFEST.json" | sha256sum --check --strict
            echo "47d746e8575f3c2b481082ecb6dc90a5b7be809e675f09bb113b0699acd5cb49  MIGRATION_MANIFEST.yaml" | sha256sum --check --strict
            echo "FINAL_MANIFEST_REGEN=DEFERRED_A_B_C_NOT_INTEGRATED"
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Run the complete test regression
        run: |
          # Every test module in the repository, on Linux, in addition to the
          # enumerated authority suites above: no module can be left out of
          # the gate by omission.
          PYTEST_BASETEMP="${RUNNER_TEMP}/kong-source-head-pytest"
          TMPDIR="${RUNNER_TEMP}/kong-source-head-tmp"
          rm -rf "$PYTEST_BASETEMP" "$TMPDIR"
          mkdir -p "$TMPDIR"
          export TMPDIR
          pytest -q -p no:cacheprovider --basetemp "$PYTEST_BASETEMP"
          git diff --exit-code
          test -z "$(git status --porcelain)"

  merge-result:
    name: merge-result
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out synthetic merge result
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify merge-result validation toolchain
        run: |
          set -Eeuo pipefail
          # The self-hosted Kong runner has Lua installed; CI must not require sudo.
          command -v lua5.4
          command -v lua
          command -v luac
          lua5.4 -v
          luac -v
          python3 -m pip install --disable-pip-version-check pytest PyYAML -r tools/gateway-test-requirements.txt
      - name: Validate merge-result calling policy and manifests
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          python3 scripts/validate_kong_calling_policy.py
          python3 scripts/validate_kong_foundation.py --v3-phase auto | tee /tmp/kong-v3-foundation.txt
          luac -p deploy/kong/calling-policy.lua
          pytest -q tests/test_kong_calling_policy.py tests/test_kong_read_only_capture.py tests/test_gateway_release_boundaries.py tests/test_kong_runtime_certification.py tests/test_release_candidate_promotion.py tests/test_runtime_integration_preflight.py tests/test_kong_admin_channel.py tests/test_kong_standby_apply.py tests/test_kong_standby_rollback.py tests/test_gateway_integrations.py tests/test_gateway_plugins.py tests/test_gateway_foundation_authority.py tests/test_kong_foundation.py
          if grep -q '^V3_PHASE=INTEGRATED$' /tmp/kong-v3-foundation.txt; then
            python3 tools/generate_migration_manifests.py --check
            python3 tools/verify_migration_manifest.py
            echo "FINAL_MANIFEST_REGEN=PASS"
          else
            echo "867904618fcdf98ef603e27a5ff9fa8dda0ee1b78c9a030b317ea1391dfafb4a  MIGRATION_MANIFEST.json" | sha256sum --check --strict
            echo "47d746e8575f3c2b481082ecb6dc90a5b7be809e675f09bb113b0699acd5cb49  MIGRATION_MANIFEST.yaml" | sha256sum --check --strict
            echo "FINAL_MANIFEST_REGEN=DEFERRED_A_B_C_NOT_INTEGRATED"
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate:
    name: validate
    if: always()
    needs: [source-head, merge-result]
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    steps:
      - name: Require exact head and applicable merge-result validation
        env:
          HEAD_RESULT: ${{ needs.source-head.result }}
          MERGE_RESULT: ${{ needs.merge-result.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          test "${HEAD_RESULT}" = success
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            test "${MERGE_RESULT}" = success
          else
            test "${MERGE_RESULT}" = skipped
          fi