name: codestra-gateway-traditional
services:
  kong-proxy-1:
    read_only: true
    user: 1000:1000
    cap_drop: &id001
    - ALL
    security_opt: &id002
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: '1.0'
    restart: 'no'
    stop_signal: SIGQUIT
    stop_grace_period: 300s
    tmpfs: &id003
    - /tmp:rw,noexec,nosuid,size=64m
    - /usr/local/kong:rw,nosuid,size=256m,uid=1000,gid=1000
    image: ${KONG_PLATFORM_IMAGE_REPOSITORY:?reviewed gateway image repository required}@${KONG_PLATFORM_IMAGE_DIGEST:?immutable
      sha256 digest required}
    profiles:
    - traditional-source
    entrypoint:
    - /usr/local/bin/codestra-kong-entrypoint
    environment:
      KONG_PREFIX: /usr/local/kong
      KONG_NGINX_DAEMON: 'off'
      KONG_NGINX_MAIN_WORKER_SHUTDOWN_TIMEOUT: 240s
      KONG_ADMIN_LISTEN: 'off'
      KONG_ADMIN_GUI_LISTEN: 'off'
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: 'off'
      KONG_ADMIN_ACCESS_LOG: 'off'
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: warn
      KONG_ANONYMOUS_REPORTS: 'off'
      KONG_PLUGINS: bundled,codestra-authz,codestra-request-context,codestra-webhook-verifier,codestra-private-surface,codestra-resource-guard
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /run/secrets/trust_ca
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-postgres.internal.codestra
      KONG_PG_PORT: '5432'
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong_runtime
      KONG_PG_PASSWORD_FILE: /run/secrets/kong_runtime_password
      KONG_PG_SSL: 'on'
      KONG_PG_SSL_REQUIRED: 'on'
      KONG_PG_TIMEOUT: '5000'
      KONG_PG_SSL_VERIFY: 'on'
      KONG_PG_MAX_CONCURRENT_QUERIES: '20'
      KONG_ROLE: traditional
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl
      KONG_SSL_CERT: /run/secrets/proxy_cert
      KONG_SSL_CERT_KEY: /run/secrets/proxy_key
      KONG_LICENSE_PATH: /run/secrets/kong_license
      KONG_STATUS_ACCESS_LOG: 'off'
      KONG_VAULTS: env
      KONG_TRUSTED_IPS: ${KONG_TRUSTED_IPS:?exact approved Caddy and upstream-gateway
        source CIDRs required}
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: 'on'
      CODESTRA_RUNTIME_APPLY_AUTHORIZED: 'false'
      CODESTRA_TRADITIONAL_APPROVAL: ${CODESTRA_TRADITIONAL_APPROVAL:?explicit KONG
        fallback approval required}
    networks:
    - kong_proxy
    - kong_database
    - kong_rate_limit
    - observability
    - middleware_upstream
    secrets:
    - trust_ca
    - kong_runtime_password
    - proxy_cert
    - proxy_key
    - redis_password
    - kong_license
    - oidc_cache_tokens_salt
    command:
    - kong
    - docker-start
    volumes:
    - type: bind
      source: ../kong/plugins/codestra-authz
      target: /usr/local/share/lua/5.1/kong/plugins/codestra-authz
      read_only: true
    - type: bind
      source: ../kong/plugins/codestra-request-context
      target: /usr/local/share/lua/5.1/kong/plugins/codestra-request-context
      read_only: true
    - type: bind
      source: ../kong/plugins/codestra-webhook-verifier
      target: /usr/local/share/lua/5.1/kong/plugins/codestra-webhook-verifier
      read_only: true
    - type: bind
      source: ../kong/plugins/codestra-private-surface
      target: /usr/local/share/lua/5.1/kong/plugins/codestra-private-surface
      read_only: true
    - type: bind
      source: ../kong/plugins/codestra-resource-guard
      target: /usr/local/share/lua/5.1/kong/plugins/codestra-resource-guard
      read_only: true
    - type: bind
      source: ${GATEWAY_WEBHOOK_SECRET_DIRECTORY:?approved per-integration webhook
        secret directory required}
      target: /run/secrets/webhooks
      read_only: true
    - type: bind
      source: ./runtime-guard.sh
      target: /etc/codestra/runtime-guard.sh
      read_only: true
    - type: bind
      source: ./codestra-kong-entrypoint.sh
      target: /usr/local/bin/codestra-kong-entrypoint
      read_only: true
    healthcheck:
      test: &id004
      - CMD
      - curl
      - --fail
      - --silent
      - --show-error
      - --noproxy
      - '*'
      - --max-time
      - '3'
      - http://127.0.0.1:8100/status/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
